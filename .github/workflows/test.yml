name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paigalda testid
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Käivita testid
        working-directory: tests
        run: npm test
