<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>API reference layout</title>
<style>
/* Design tokens: swap these and nothing else to re-skin. */
:root{
  --brand:#1832b2; --accent:#fcf88c; --ok:#94a96b; --warn:#ffa054; --bad:#b33828;
  --ink:#1b1821; --muted:#65646c; --line:#dadbe0; --mist:#ececf4; --canvas:#fef9f5; --card:#fff;
  --r:12px; --font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box} body{margin:0;background:var(--canvas);color:var(--ink);font:14px/20px var(--font)}
h1,h2,h3,p,ul{margin:0} ul{padding:0;list-style:none} a{color:var(--brand)}
code{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--mist);border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.lbl{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase}
.muted{color:var(--muted)}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:auto;padding:12px 16px;display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:3px;font-size:16px;flex:1}
.badge{background:var(--accent);border:1px solid var(--ink);border-radius:6px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.shell{max-width:1280px;margin:auto;display:grid;grid-template-columns:260px minmax(0,1fr);align-items:start}
aside{position:sticky;top:58px;max-height:calc(100vh - 58px);overflow:auto;padding:16px;border-right:1px solid var(--line)}
aside input{width:100%;height:40px;border:0;border-radius:var(--r);background:var(--mist);padding:0 12px;font:inherit}
details{border:0} summary{cursor:pointer;list-style:none;padding:16px 8px 6px;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none} summary::after{content:"+"} details[open] summary::after{content:"\2212"}
aside a{display:block;padding:6px 10px;border-radius:8px;color:var(--muted);text-decoration:none}
aside a:hover,aside a.on{background:var(--mist);color:var(--ink)}
[hidden]{display:none!important}
main{padding:24px 16px 56px 28px;display:flex;flex-direction:column;gap:44px;min-width:0}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1;color:var(--brand);letter-spacing:-.5px}
h2{font-size:26px;line-height:32px;font-weight:400} h3{font-size:16px;font-weight:500;padding-top:6px}
.sec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:76px}
.lede{max-width:72ch;font-size:16px;line-height:24px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 24px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kv span{display:block} .note{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:14px 18px;max-width:80ch}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%} th,td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line)}
th{background:var(--mist);font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;white-space:nowrap}
tr:last-child td{border-bottom:0}
/* Labels carry a shape AND a word, never colour alone. */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:16px;padding:1px 10px 1px 8px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap;border:1px solid transparent}
.pill i{width:9px;height:9px;background:currentColor;display:inline-block}
.pass{background:var(--ok)}.pass i{border-radius:50%}
.review{background:var(--warn)}.review i{clip-path:polygon(50% 0,100% 100%,0 100%)}
.gap{background:var(--bad);color:#fff}
.manual{background:var(--mist);border-color:var(--muted)}.manual i{transform:rotate(45deg) scale(.85)}
.off{background:#fff;border:1px dashed var(--muted)}.off i{background:none;border:2px solid currentColor;border-radius:50%}
.method{font:700 11px ui-monospace,Menlo,monospace;border-radius:6px;padding:1px 8px;border:1px solid var(--muted);background:#fff}
.method.read{background:var(--brand);color:#fff;border-color:var(--brand)} .method.write{background:var(--accent);border-color:var(--ink)}
.empty{padding:16px;border:1px dashed var(--muted);border-radius:var(--r);background:var(--card)}
footer{background:#f1f2f4;border-top:1px solid var(--line);padding:24px 16px;text-align:center;color:var(--muted);font-size:12px}
.toggle{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)} aside{position:static;max-height:none;border:0;border-bottom:1px solid var(--line);display:none}
  aside.open{display:block} .toggle{display:inline-flex;margin:12px 16px 0;height:40px;align-items:center;padding:0 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font:inherit}
  main{padding:20px 16px 40px}
}
@media print{header.top,aside,.toggle{display:none} .shell{display:block}}
</style></head>
<body>
<header class="top"><div class="top-in"><span class="logo" id="logo"></span><span class="badge" id="badge"></span></div></header>
<button class="toggle" id="toggle" aria-expanded="false" aria-controls="side">Contents</button>
<div class="shell">
  <aside id="side" aria-label="Contents">
    <label class="lbl" for="q" style="display:block;margin-bottom:6px">Find</label>
    <input id="q" type="search" placeholder="operation, rule or term" autocomplete="off">
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
<footer id="foot"></footer>

<!-- THE ONLY PART YOU EDIT: the spec. Everything below it just draws it. -->
<script type="application/json" id="spec">
{
  "brand": "YOUR ORG",
  "title": "How our setup runs, exactly",
  "intro": "What the tool can read, what it can change, what it never touches, and who decides each rule.",
  "badge": "Sample data",
  "stamp": "Built from example-api v1 on 2026-01-01",
  "sections": [
    {"id":"overview","group":"Start","title":"Overview","lede":"One paragraph that says what this is and who it is for.",
     "blocks":[
       {"type":"kv","items":[["Version","1.0.0"],["Host","api.example.test (locked in code)"],["Allowed operations","6: 4 read, 2 write"],["Last checked","2026-01-01"]]},
       {"type":"note","text":"**Verified:** what was actually run. **Not verified:** what was not. Say both."}
     ]},
    {"id":"rules","group":"Guidelines","title":"The rules","lede":"",
     "blocks":[{"type":"table","columns":["Rule","What it means","How it is held"],
       "rows":[["1 · No personal data","Configuration only.","Not on the allowlist. A denied-prefix list backs it up."],
               ["2 · Test first","Everything runs against the test host.","Host lock in code. No flag changes it."],
               ["3 · Ask before you save","Show the plan with real values, wait for a yes.","Approval code for the whole plan."]]}]},
    {"id":"op-rooms","group":"Operations","title":"Rooms","lede":"One section per area. Each row is one operation.",
     "blocks":[{"type":"ops","rows":[
       {"mode":"read","path":"rooms/getAll","status":{"s":"pass","t":"Allowed"},"desc":"List all rooms. Paged."},
       {"mode":"write","path":"rooms/add","status":{"s":"review","t":"Plan only"},"desc":"Create rooms. Needs a yes to the exact plan."},
       {"mode":"write","path":"rooms/delete","status":{"s":"off","t":"Closed"},"desc":"Closed on purpose. Ask the owner."}]}]},
    {"id":"statuses","group":"Usage","title":"Statuses","lede":"",
     "blocks":[{"type":"table","columns":["Label","Meaning"],"rows":[
       [{"s":"pass","t":"Pass"},"Checked and as promised."],
       [{"s":"gap","t":"Gap"},"Checked and different from the standard."],
       [{"s":"review","t":"Needs a look"},"Ambiguous. A person decides."],
       [{"s":"manual","t":"Manual"},"Cannot be checked by the tool. Stays on the manual list."],
       [{"s":"off","t":"Closed"},"Switched off on purpose."]]}]}
  ]
}
</script>

<script>
(function(){
  var spec = JSON.parse(document.getElementById('spec').textContent);
  var $ = function(id){return document.getElementById(id)};
  function el(tag, cls, text){var e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e}
  // Inline markup, safely: `code` and **bold** only. Everything else is plain text.
  function rich(parent, s){
    String(s).split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(function(p){
      if(!p) return;
      if(p[0]==='`') parent.appendChild(el('code',null,p.slice(1,-1)));
      else if(p.slice(0,2)==='**'){var b=el('b',null,p.slice(2,-2)); parent.appendChild(b)}
      else parent.appendChild(document.createTextNode(p));
    });
  }
  function pill(o){var p=el('span','pill '+o.s); p.appendChild(el('i')); p.appendChild(document.createTextNode(o.t)); return p}
  function cell(td, v){ if(v && typeof v==='object') td.appendChild(pill(v)); else rich(td, v) }

  $('logo').textContent = spec.brand; $('badge').textContent = spec.badge || '';
  $('badge').hidden = !spec.badge; $('foot').textContent = spec.stamp || '';
  document.title = spec.title;

  var main=$('main'), nav=$('nav');
  var hero=el('div','sec'); hero.appendChild(el('span','lbl muted','Reference')); hero.appendChild(el('h1',null,spec.title));
  var lede=el('p','lede'); rich(lede, spec.intro||''); hero.appendChild(lede); main.appendChild(hero);

  var groups={}, order=[];
  spec.sections.forEach(function(s){
    if(!groups[s.group]){groups[s.group]=[];order.push(s.group)} groups[s.group].push(s);
    var sec=el('section','sec'); sec.id=s.id; sec.dataset.text=''; sec.appendChild(el('h2',null,s.title));
    if(s.lede){var l=el('p','lede'); rich(l,s.lede); sec.appendChild(l)}
    (s.blocks||[]).forEach(function(b){
      if(b.type==='kv'){var d=el('div','kv'); b.items.forEach(function(it){var x=el('div'); x.appendChild(el('span','lbl muted',it[0])); var v=el('span'); rich(v,it[1]); x.appendChild(v); d.appendChild(x)}); sec.appendChild(d)}
      else if(b.type==='note'){var n=el('div','note'); rich(n,b.text); sec.appendChild(n)}
      else if(b.type==='table'||b.type==='ops'){
        var cols=b.type==='ops'?['Operation','Access','Status','What it does']:b.columns;
        var rows=b.type==='ops'?b.rows.map(function(r){return [{m:r.mode,p:r.path},r.mode==='write'?'Write':'Read',r.status,r.desc]}):b.rows;
        var wrap=el('div','tscroll'), t=el('table'), th=el('thead'), tr=el('tr');
        cols.forEach(function(c){tr.appendChild(el('th',null,c))}); th.appendChild(tr); t.appendChild(th);
        var tb=el('tbody'); rows.forEach(function(r){var row=el('tr');
          r.forEach(function(v,i){var td=el('td');
            if(v&&v.p!==undefined){td.appendChild(el('span','method '+v.m,v.m==='write'?'WRITE':'READ')); td.appendChild(document.createTextNode(' ')); td.appendChild(el('code',null,v.p))}
            else cell(td,v); row.appendChild(td)}); tb.appendChild(row)});
        t.appendChild(tb); wrap.appendChild(t); sec.appendChild(wrap);
      }
    });
    sec.dataset.text=sec.textContent.toLowerCase(); main.appendChild(sec);
  });
  var empty=el('div','empty','Nothing matches. Clear the search box.'); empty.hidden=true; main.appendChild(empty);

  order.forEach(function(g,i){var d=el('details'); if(i===0)d.open=true; d.appendChild(el('summary','lbl',g));
    groups[g].forEach(function(s){var a=el('a',null,s.title); a.href='#'+s.id; a.dataset.sec=s.id; d.appendChild(a)}); nav.appendChild(d)});

  // Search: hides sections and links that do not contain the text.
  $('q').addEventListener('input',function(e){var q=e.target.value.trim().toLowerCase(), shown=0;
    spec.sections.forEach(function(s){var sec=$(s.id), hit=!q||sec.dataset.text.indexOf(q)>-1; sec.hidden=!hit; if(hit)shown++;
      var a=nav.querySelector('[data-sec="'+s.id+'"]'); a.hidden=!hit; if(hit&&q)a.parentNode.open=true});
    empty.hidden=shown>0});
  // Mobile contents toggle.
  $('toggle').addEventListener('click',function(){var o=$('side').classList.toggle('open'); this.setAttribute('aria-expanded',o)});
  // Highlight the section in view.
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){
      nav.querySelectorAll('a.on').forEach(function(a){a.classList.remove('on')});var a=nav.querySelector('[data-sec="'+e.target.id+'"]'); if(a)a.classList.add('on')}})},{rootMargin:'-20% 0px -70% 0px'});
    spec.sections.forEach(function(s){io.observe($(s.id))})}
})();
</script>
</body></html>
