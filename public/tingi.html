function askU(){return Math.max(4,Math.min(25,S.ask));}
function payNow(){return S.pay!==null&&S.pay>0?S.pay:60000;}
function confidence(){var q=0;if(S.styleP<.6)q++;if(S.prHeard===0)q++;return q===0?'high':(q===1?'mid':'low');}
function question(){if(S.styleP<.6)return 'askStyle';if(S.prHeard===0)return 'askPrio';return null;}
function chip(kind,p){return '<span class="chip t-info">[inferred] '+esc(tr(kind,{p:Math.round(p*100)}))+'</span>';}

function renderExamples(){
  var h='';[1,2,3].forEach(function(i){h+='<button type="button" class="sit" data-ex="'+i+'" data-mr-c="tingi.sentence.example">'+esc(tr('ex'+i))+'</button>';});
  $('examples').innerHTML=h;
  Array.prototype.forEach.call($('examples').querySelectorAll('button'),function(b){b.onclick=function(){
    $('sentence').value=tr('ex'+b.getAttribute('data-ex'));MR.track('Sample Loaded',{},'tingi.sentence.example');listen();
  };});
}
function renderPrio(){
  var keep=S?S.pr:null;
  [1,2,3].forEach(function(i){var h='';LEV.forEach(function(l){h+='<option value="'+l+'">'+esc(tr('lvl_'+l))+'</option>';});$('pr'+i).innerHTML=h;$('pr'+i).value=keep?keep[i-1]:DEF_PR[i-1];});
}
function renderReading(){
  if(!S)return;
  $('reading').hidden=false;
  var q=question();$('askNote').hidden=!q;if(q)$('askNote').textContent=tr(q);
  var h='';
  STYLES.forEach(function(k){h+='<button type="button" class="sit" data-style="'+k+'" aria-pressed="'+(S.style===k)+'" data-mr-c="tingi.reading.chip"><b>'+esc(tr('st_'+k))+'</b>'+(S.style===k&&S.styleP<1?' <span class="tags">'+chip('guess',S.styleP)+'</span>':'')+'</button>';});
  $('rStyle').innerHTML=h;
  Array.prototype.forEach.call($('rStyle').querySelectorAll('button'),function(b){b.onclick=function(){S.style=b.getAttribute('data-style');S.styleP=1;S.offered=false;MR.track('Reading Corrected',{field:'style'},'tingi.reading.chip');renderAll();};});
  h='';
  CLAIMS.forEach(function(c){var d=S.claims[c];h+='<button type="button" class="sit" data-claim="'+c+'" aria-pressed="'+d.on+'" data-mr-c="tingi.reading.chip"><b>'+esc(tr('cl_'+c))+'</b> <span class="tags">'+(d.p>=.6?chip('heard',d.p):'<span class="chip">'+esc(tr('dflt'))+'</span>')+'</span></button>';});
  $('rClaims').innerHTML=h;
  Array.prototype.forEach.call($('rClaims').querySelectorAll('button'),function(b){b.onclick=function(){var c=b.getAttribute('data-claim');S.claims[c].on=!S.claims[c].on;MR.track('Reading Corrected',{field:'claim'},'tingi.reading.chip');renderAll();};});
  [1,2,3].forEach(function(i){$('pr'+i).value=S.pr[i-1];});
  $('prNote').textContent=S.prHeard?'':tr('prNone');
  var set=function(id,v){if(document.activeElement!==$(id))$(id).value=v===null?'':String(v).replace('.',L()==='et'?',':'.');};
  set('f-ask',S.askKnown?S.ask:'');set('f-offer',S.offerKnown&&S.offer!==null?S.offer:'');set('f-walk',S.walk===null?'':S.walk);set('f-pay',S.pay===null?'':S.pay);
  $('f-ask').placeholder='10';$('f-offer').placeholder=pct(VM.BASE[S.style]);$('f-pay').placeholder='60000';
  $('unk').textContent=(S.pay===null?tr('unkPay',{pay:fe(60000)}):'')+tr('unkRest',{v:VM.VERSION,o:VM.OWNER,r:VM.REVIEWED});
}
function pkgs(){
  var style=S.style,offer=offerNow(),pay=payNow(),pr=S.pr,au=askU();
  var B=(offer+VM.POOL[style])*(S.cut?0.7:1),mx=VM.levMax('salary',au),cap=S.cap?VM.capSteps(offer):null,maxS=cap!==null?Math.min(mx,cap):mx,sS=Math.round(offer*2);
  var o0={style:style,pr:pr,pay:pay,askU:au,B:B},v0=offer*VM.rho('salary',pr);
  var cls=[{id:'A',lo:Math.min(maxS,Math.ceil(sS*.7)),hi:maxS},{id:'B',lo:Math.min(maxS,Math.ceil(sS*.4)),hi:Math.min(maxS,Math.floor(sS*.7))},{id:'C',lo:0,hi:Math.min(maxS,Math.floor(sS*.4))}].filter(function(c){return c.lo<=c.hi;});
  var good=[];
  cls.forEach(function(c){var b=VM.bestP({style:style,pr:pr,pay:pay,askU:au,B:B,minSalary:c.lo,maxSalary:c.hi});if(b.p&&b.v>=v0-1e-9)good.push({c:c,best:b});});
  var full=VM.bestP({style:style,pr:pr,pay:pay,askU:au,B:B,maxSalary:maxS});
  var out={B:B,v0:v0,offer:offer,full:full,pk:[],pick:null,cap:cap};
  if(!good.length)return out;
  var T0=Math.max(v0,0.9*Math.min.apply(null,good.map(function(x){return x.best.v;})));
  good.forEach(function(x){var p=VM.cheapestP({style:style,pr:pr,pay:pay,askU:au,B:B,minSalary:x.c.lo,maxSalary:x.c.hi,target:T0});
    if(p.p){var key=JSON.stringify(p.p);if(!out.pk.some(function(q){return q.key===key;}))out.pk.push({id:x.c.id,p:p.p,c:p.c,v:p.v,key:key});}});
  if(!out.pk.length)return out;
  out.single=out.pk.length===1;
  out.pick=out.pk.slice().sort(function(a,b){return a.c-b.c||b.v-a.v;})[0];
  return out;
}
function amt(l,st){return l==='salary'?pct(st*.5):(l==='bonus'?pct(st*.5)+'% ('+fe(payNow()*st*.5/100)+')':(l==='leave'?st*2:(l==='learn'?fe(st*500):(l==='review'?st*3:st))));}
function describeP(p){var a=LEV.filter(function(l){return (p[l]||0)>0;}).map(function(l){return tr('lvt_'+l,{n:amt(l,p[l])});});return a.length?a.join(', '):tr('md_none');}
function timeLine(p){var h=((p.leave||0)*2*8)+((p.hours||0)*46);return h>0?tr('dl_time0',{h:h}):'';}
function renderBoard(){
  if(!S)return;
  $('board').hidden=false;
  var b=pkgs(),offer=b.offer,h='';
  var lim='<button type="button" class="sit" data-lim="cap" aria-pressed="'+S.cap+'" data-mr-c="tingi.board.limit-toggle">'+esc(tr('limCap',{c:pct(VM.capSteps(offer)/2)}))+'</button><button type="button" class="sit" data-lim="cut" aria-pressed="'+S.cut+'" data-mr-c="tingi.board.limit-toggle">'+esc(tr('limCut'))+'</button>';
  $('limits').innerHTML=lim;
  Array.prototype.forEach.call($('limits').querySelectorAll('button'),function(x){x.onclick=function(){var k=x.getAttribute('data-lim');S[k]=!S[k];S.offered=false;if(S[k])MR.track('Surprise Drawn',{surprise_id:k},'tingi.board.limit-toggle');renderBoard();};});
  $('baseLine').textContent=tr('base',{o:pct(offer),v0:pct(b.v0),b:pct(b.B)});
  var tags={A:'tagA',B:'tagB',C:'tagC'};
  b.pk.forEach(function(x){h+='<li><b>'+esc(tr('pkgName',{n:x.id}))+'</b> <span class="chip">'+esc(tr(tags[x.id]))+'</span><br>'+esc(tr('pkgRow',{t:describeP(x.p),c:pct(x.c),v:pct(x.v)}))+(timeLine(x.p)?'<br><span class="k">'+esc(timeLine(x.p))+'</span>':'')+'</li>';});
  $('pkgs').innerHTML=h;
  $('oneOnly').hidden=!b.single;$('oneOnly').textContent=b.single?tr('oneOnly'):'';
  var none=!b.pk.length;$('noRoom').hidden=!none;$('noRoom').textContent=none?tr('noRoom',{v0:pct(b.v0)}):'';
  $('offer').disabled=none;
  var res='';
  if(S.offered&&b.pick){var p=b.pick;res='<b>'+esc(tr('picked',{n:p.id,c:pct(p.c),v:pct(p.v),v0:pct(b.v0),vs:pct(b.full.v),p:b.full.v>0?Math.round(p.v/b.full.v*100):100,g:b.v0>0?Math.round((b.full.v/b.v0-1)*100):0}))+'</b>';}
  $('boardRes').innerHTML=res;
  $('deeper').hidden=false;$('fail').hidden=!S.offered;
  var first=CLAIMS.filter(function(c){return S.claims[c].on;})[0];
  var hash='#s='+S.style+'&a='+encodeURIComponent(String(askU()))+(S.walk!==null?'&w='+encodeURIComponent(String(S.walk)):'')+'&p='+S.pr.join(',')+(first?'&k='+first:'');
  $('playbookLink').setAttribute('href','playbook.html'+(MR.lang!=='et'?'?lang='+encodeURIComponent(MR.lang):'')+hash);
}
function renderAll(){renderReading();renderBoard();}

function listen(){
  var text=$('sentence').value.trim();if(!text)return;
  var R=readSentence(text);S=derive(R);S.sentence=text;
  MR.track('Sentence Read',{confidence:confidence()},'tingi.sentence.listen-button');
  renderPrio();renderAll();$('h-read').focus();$('reading').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- vestluskaart (markdown) ---------- */
function cardMd(hide){
  var b=pkgs(),nl='\n',md='# '+tr('md_title')+nl+nl+'_'+tr('md_note')+'_'+nl+nl+'## '+tr('md_heard')+nl+nl;
  md+='- '+tr('md_sentence')+': '+S.sentence+nl+'- '+tr('md_style')+': '+tr('st_'+S.style)+nl+'- '+tr('md_prio')+': '+S.pr.map(function(l){return tr('lvl_'+l);}).join(', ')+nl;
  md+='- '+tr('md_ask')+': '+pct(askU())+'%'+nl+'- '+tr('md_offer')+': '+pct(b.offer)+'%'+nl;
  md+=nl+'## '+tr('md_board')+nl+nl;
  if(!b.pk.length)md+=tr('noRoom',{v0:pct(b.v0)})+nl;
  b.pk.forEach(function(x){md+='- '+tr('pkgName',{n:x.id})+': '+describeP(x.p)+(hide?'':' ('+tr('pkgRow',{t:'',c:pct(x.c),v:pct(x.v)}).replace(/^\.\s*/,'')+')')+nl;});
  if(b.pick)md+=nl+'## '+tr('md_pick')+nl+nl+tr('pkgName',{n:b.pick.id})+nl;
  md+=nl+'## '+tr('md_unk')+nl+nl+(S.pay===null?tr('unkPay',{pay:fe(60000)}):'')+tr('unkRest',{v:VM.VERSION,o:VM.OWNER,r:VM.REVIEWED})+nl;
  return md;
}

function applyT(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(e){e.textContent=tr(e.getAttribute('data-t'));});
  Array.prototype.forEach.call(document.querySelectorAll('[data-t-ph]'),function(e){e.setAttribute('placeholder',tr(e.getAttribute('data-t-ph')));});
  $('examples').setAttribute('aria-label',tr('exH'));
  $('modelLine').textContent=tr('unkRest',{v:VM.VERSION,o:VM.OWNER,r:VM.REVIEWED});
  document.title=tr('h1')+' | Raha Meeled';
}
function init(){
  applyT();renderPrio();renderExamples();
  $('listen').onclick=listen;
  [1,2,3].forEach(function(i){$('pr'+i).addEventListener('change',function(){if(!S)return;var seen=[];S.pr=[1,2,3].map(function(j){return $('pr'+j).value;}).filter(function(x){if(seen.indexOf(x)>=0)return false;seen.push(x);return true;});
    LEV.forEach(function(l){if(S.pr.length<3&&S.pr.indexOf(l)<0)S.pr.push(l);});S.prHeard=3;S.offered=false;MR.track('Reading Corrected',{field:'priority'},'tingi.reading.chip');renderAll();});});
  var num=function(id){var v=$(id).value.trim().replace(/\s|\u00a0/g,'').replace(',','.');if(v==='')return null;var n=Number(v);return isFinite(n)&&n>=0?n:null;};
  var bind=function(id,field,fn){$(id).addEventListener('input',function(){if(!S)return;fn(num(id));S.offered=false;MR.track('Reading Corrected',{field:field},'tingi.reading.chip');renderBoard();});};
  bind('f-ask','ask',function(n){S.askKnown=n!==null;S.ask=n!==null?n:10;});
  bind('f-offer','offer',function(n){S.offerKnown=n!==null;S.offer=n;});
  bind('f-walk','walk',function(n){S.walk=n;});
  bind('f-pay','pay',function(n){S.pay=n;});
  $('offer').onclick=function(){if(!S)return;var b=pkgs();if(!b.pick)return;S.offered=true;MR.track('Package Offered',{result:'picked'},'tingi.board.offer-button');renderBoard();};
  $('mdBtn').onclick=function(){
    if(!S)return;var hide=$('mdHide').checked,blob=new Blob([cardMd(hide)],{type:'text/markdown'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='vaidle.md';document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);$('mdMsg').textContent=tr('mdMsg');
    MR.track('Card Downloaded',{card:'tingi',amounts:hide?'hidden':'shown'},'tingi.file.md-button');
  };
  MR.onLang(function(){applyT();renderPrio();renderExamples();if(S)renderAll();});
}
window.DEBATE_LIGHT={read:readSentence,derive:derive,state:function(){return S;},pkgs:pkgs,VM:VM};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
