ul.nm{padding-left:18px;margin:6px 0}
ul.nm li{margin-bottom:4px}
.sit{display:block;width:100%;text-align:left;margin:0 0 8px;font:inherit;font-size:16px;line-height:1.35;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}

.khead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.khead h2{margin:0}
.kmeta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.knot.collapsed .kbody{display:none}
.knext{margin-top:10px}
.pot{display:flex;height:34px;border-radius:10px;overflow:hidden;margin:8px 0 4px}
.pot>i{display:block;height:100%;border-right:2px solid var(--card)}
.potleg{font-family:var(--sans);font-size:13px;color:var(--ink2);line-height:1.5}
.dream{font-family:var(--serif);font-size:17px;line-height:1.5;margin:0 0 6px}
.dream i{color:var(--ink)}
.knot.end{border-color:var(--sun)}
.big{font-family:var(--serif);font-size:44px;line-height:1;font-weight:500}
.rv{list-style:none;margin:8px 0;padding:0}
.rv li{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.rv li:first-child{border-top:0}
.rv .k{color:var(--ink2);font-size:13px}
.acts{align-items:center}
.acts select{font:inherit;font-size:15px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px;max-width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.num{white-space:nowrap}
.shead{outline:none}

.lev{padding:8px 0;border-top:1px solid var(--line)}
.lev:first-child{border-top:0}
.lev label{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600}
.lev input[type=range]{width:100%;margin:6px 0;accent-color:var(--link);min-height:28px}
.lev .small{margin:0}
.pk{list-style:none;margin:6px 0;padding:0}
.pk li{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.pk li:first-child{border-top:0}
.sc{background:var(--info-bg);color:var(--info-fg);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px}

<main id="main">
<a class="back" href="tingi.html" data-t="back"></a>
<h1 data-t="h1"></h1>
<p class="lead" data-t="lead"></p>
<p class="sub" data-t="sub"></p>

<div class="card" id="pick">
  <h2 id="h-pick" class="shead" tabindex="-1" data-t="pickH"></h2>
  <p class="small" data-t="pickP"></p>
  <div id="sits" role="group" aria-labelledby="h-pick"></div>
  <p class="small" data-t="pickNote"></p>
</div>
<div class="card" id="panel" hidden></div>

<div class="card" id="compass">
  <h2 data-t="compH"></h2>
  <p class="small" data-t="compP"></p>
  <ul class="nm"><li data-t-html="comp1"></li><li data-t-html="comp2"></li><li data-t-html="comp3"></li></ul>
  <p class="small" data-t-html="compMarks"></p>
</div>

<div class="card" id="dreamCard">
  <h2 data-t="dreamH"></h2>
  <p class="small" data-t-html="dreamP"></p>
  <label class="small" for="unistus" data-t="dreamLbl"></label>
  <input id="unistus" class="t" maxlength="140" autocomplete="off" data-t-ph="dreamPh" style="font-size:17px">
</div>

<div class="card" id="inputs">
  <h2 data-t="inH"></h2>
  <p><span class="chip t-info" id="sampleChip" data-t="sampleChip" hidden></span></p>
  <div class="fields">
    <div><label for="pay" data-t="fPay"></label><input id="pay" inputmode="decimal" autocomplete="off"></div>
    <div><label for="keep" data-t="fKeep"></label><input id="keep" inputmode="decimal" autocomplete="off"></div>
    <div><label for="ask" data-t="fAsk"></label><input id="ask" inputmode="decimal" autocomplete="off"></div>
    <div><label for="share" data-t="fShare"></label><input id="share" inputmode="decimal" autocomplete="off"></div>
    <div><label for="save0" data-t="fSave0"></label><input id="save0" inputmode="decimal" autocomplete="off"></div>
    <div><label for="assets" data-t="fAssets"></label><input id="assets" inputmode="decimal" autocomplete="off"></div>
    <div><label for="spend" data-t="fSpend"></label><input id="spend" inputmode="decimal" autocomplete="off"></div>
    <div><label for="wr" data-t="fWr"></label><input id="wr" inputmode="decimal" autocomplete="off"></div>
    <div class="full"><label for="years" data-t="fYears"></label><input id="years" inputmode="decimal" autocomplete="off"></div>
  </div>
  <div class="row">
    <button class="btn" type="button" id="sample" data-mr-c="mangukast.inputs.sample-button" data-mr-e="Sample Loaded" data-t="sampleBtn"></button>
    <button class="btn" type="button" id="clear" data-t="clearBtn"></button>
  </div>
  <p class="small" data-t="inNote"></p>
</div>

<div class="card" id="limits">
  <h2 id="h-lim" data-t="limH"></h2>
  <p class="small" data-t="limP"></p>
  <div class="fields">
    <div class="full"><label for="walk" data-t="fWalk"></label><input id="walk" inputmode="decimal" autocomplete="off"></div>
    <div><label for="pr1" data-t="fPr1"></label><select id="pr1"></select></div>
    <div><label for="pr2" data-t="fPr2"></label><select id="pr2"></select></div>
    <div class="full"><label for="pr3" data-t="fPr3"></label><select id="pr3"></select></div>
  </div>
  <p class="small" data-t="limNote"></p>
</div>

<div class="card" id="evCard" hidden>
  <h2 id="h-ev" data-t="evH"></h2>
  <p class="small" data-t="evP"></p>
  <div id="evs" role="group" aria-labelledby="h-ev"></div>
</div>

<div class="card" id="offerCard" hidden>
  <h2 data-t="offerH"></h2>
  <div class="row" style="align-items:baseline;gap:14px" role="status" aria-live="polite"><span class="big" id="offerBig">0%</span><span class="small" id="offerGross"></span></div>
  <div id="offerBar"></div>
  <div class="row"><button type="button" class="btn" id="quickAccept" data-mr-c="mangukast.offer.quick" data-t="quick"></button></div>
</div>

<div id="threadWrap" hidden>
<div class="row"><button class="btn" id="openAll" type="button" data-t="openAll"></button></div>
<div id="thread">
  <svg id="threadSvg" aria-hidden="true"></svg>
  <div id="knots"></div>
  <section class="knot end" id="end">
    <span class="mk" aria-hidden="true"></span>
    <h2 data-t="endH"></h2>
    <div class="nr" id="endNr"></div>
    <div id="fireBox" data-mr-c="mangukast.fire.panel"></div>
    <div class="row"><button type="button" class="btn go" id="finishBtn" data-t="finish"></button></div>
    <div id="confirmBox" hidden>
      <h3 data-t="cH"></h3>
      <label class="small" for="sent" data-t="cP"></label>
      <textarea class="t" id="sent" maxlength="400" aria-describedby="sentHint" style="width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)"></textarea>
      <p class="small" id="sentHint" data-t="cHint"></p>
      <div class="row"><button type="button" class="btn go" id="confirmBtn" disabled data-mr-c="mangukast.offer.sentence" data-t="cBtn"></button></div>
    </div>
    <p><a class="btn" href="index.html#unista" data-t="callLink"></a> <a class="btn" href="ajatelg.html#elukaar" data-t="elukaarLink"></a></p>
  </section>
</div>
<div class="card" id="logCard"><h3 data-t="logH"></h3><ul class="nm" id="logList" aria-live="polite"></ul></div>
</div>

<div class="card" id="result" hidden>
  <h2 id="h-result" class="shead" tabindex="-1" data-t="resH"></h2>
  <p id="reveal" class="lead"></p>
  <ul class="rv" id="revealList"></ul>
  <div class="row"><button type="button" class="btn" id="again" data-mr-c="mangukast.result.restart" data-t="again"></button></div>
</div>

<div class="card" id="fail" hidden>
  <h2 data-t="fileH"></h2>
  <p data-t="fileP"></p>
  <label class="small" style="display:flex;gap:8px;align-items:center;margin:6px 0"><input id="mdHide" type="checkbox" style="width:auto"><span data-t="mdHide"></span></label>
  <div class="row"><button type="button" class="btn go" id="mdBtn" data-mr-c="mangukast.file.md-button" data-t="mdBtn"></button></div>
  <p class="small" id="mdMsg" aria-live="polite"></p>
</div>

<footer style="margin-top:36px"><p class="small"><a href="api/index.html" data-t="apiLink"></a> · <a href="ots.html" data-i18n="nav.ots"></a> · <a href="ajatelg.html" data-i18n="nav.ajatelg"></a> · <a href="kast.html" data-i18n="nav.kast"></a></p></footer>

  var B=budgetNow(),cap=S.sur.capSteps!==null?S.sur.capSteps:levMax('salary'),best=bestP(B,cap),p=curP(),c=costP(p),v=valP(p);
  var feasible=c<=B+1e-9&&p.salary<=cap,ratio=best.v>0?v/best.v:1,out=!feasible?'far':(ratio>=0.95?'best':(ratio>=0.75?'close':'far'));
  S.sur.msg={k:!feasible?'sur_over':'sur_'+out,c:pct(c),b:pct(B),p:Math.round(ratio*100),v:pct(v),vs:pct(best.v),t:describeP(best.p)};
  answered(id,out);render();
}
function answerGift(take){
  if(S.sur.cur!=='gift'||S.done)return;
  var B=budgetNow(),best=bestP(B,levCap('salary')),p=curP(),feasible=costP(p)<=B+1e-9,gap=Math.max(0,best.v-(feasible?valP(p):0)),G=mkt('title')*rho('title');
  var good=take?G>=gap-1e-9:G<gap-1e-9,out=good?'best':'far';
  S.sur.gift={take:take};S.sur.msg={k:good?'gift_ok':'gift_bad',g:pct(G),gap:pct(gap)};

}
function answerSwap(i){
  if(S.sur.cur!=='swap'||S.done)return;

  good.sort(function(a,b){return a.c-b.c;});var right=good[0],out=i===right.j?'best':'far';
  S.sur.msg=i===right.j?{k:'sw_ok',n:i+1,v0:pct(v0)}:{k:'sw_bad',n:i+1,k2:right.j+1,c:pct(right.c)};

}

/* ---------- lõng: sasipuntrast sirgeks (sama joonistus mis Lõnga otsa lehel) ---------- */
var NS='http://www.w3.org/2000/svg',svg=$('threadSvg');
function rngf(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function drawThread(){
  var box=$('thread');if(!box||$('threadWrap').hidden)return;
  var H=box.offsetHeight,R=rngf(5),h='',ys=[],bt=box.getBoundingClientRect().top;
  Array.prototype.forEach.call(document.querySelectorAll('#thread .knot'),function(n){var m=n.querySelector('.mk').getBoundingClientRect();ys.push(m.top-bt+14);});
  svg.setAttribute('viewBox','0 0 52 '+H);
  var cols=['var(--base)','var(--loan)','var(--fun)','var(--sav)'],i;
  for(i=0;i<9;i++){var cx=26+(R()*2-1)*10,cy=30+(R()*2-1)*10,rx=10+R()*14,ry=8+R()*12,rot=R()*180;h+='<ellipse cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" rx="'+rx.toFixed(1)+'" ry="'+ry.toFixed(1)+'" transform="rotate('+rot.toFixed(0)+' '+cx.toFixed(1)+' '+cy.toFixed(1)+')" fill="none" stroke="'+cols[i%4]+'" stroke-opacity="0.55" stroke-width="1.3"></ellipse>';}
  var d='M26 40',py=40;
  ys.forEach(function(y,k){var sway=Math.max(0,16-k*3),c1y=py+(y-py)*0.35,c2y=py+(y-py)*0.7,dir=k%2?1:-1;d+=' C'+(26+dir*sway)+' '+c1y.toFixed(1)+' '+(26-dir*sway)+' '+c2y.toFixed(1)+' 26 '+y.toFixed(1);py=y;});
  h+='<path d="'+d+'" fill="none" style="stroke:var(--ink2)" stroke-width="2.2" stroke-linecap="round"></path>';
  ys.forEach(function(y,k){
    if(k===ys.length-1){var a;for(a=0;a<8;a++){var ang=a*Math.PI/4;h+='<line x1="'+(26+Math.cos(ang)*16).toFixed(1)+'" y1="'+(y+Math.sin(ang)*16).toFixed(1)+'" x2="'+(26+Math.cos(ang)*22).toFixed(1)+'" y2="'+(y+Math.sin(ang)*22).toFixed(1)+'" style="stroke:var(--sun)" stroke-width="2" stroke-linecap="round"></line>';}h+='<circle class="sunc" cx="26" cy="'+y.toFixed(1)+'" r="13" style="fill:var(--sun)"></circle>';}
    else{h+='<circle cx="26" cy="'+y.toFixed(1)+'" r="13" style="fill:var(--link)"></circle><text x="26" y="'+(y+4.5).toFixed(1)+'" text-anchor="middle" font-size="13" font-weight="600" font-family="Instrument Sans,sans-serif" style="fill:var(--onlink)">'+(k+1)+'</text>';}
  });
  svg.innerHTML=h;
}

/* ---------- lõpp ja paljastus ---------- */
function claimRows(){
  return CLAIMS.map(function(c){
    var st=S.claims[c],chs=S.log.filter(function(l){return l.k==='ch'&&l.claim===c;}),best=null,mv,ef;
    chs.forEach(function(l){if(!best||RANK[l.outcome]>=RANK[best.outcome])best=l;});
    if(st.acc){mv=tr('mv_ac');ef=tr('ef_none');}
    else if(best){mv=tr('mv_ch',{e:ev(best.ev,'sl')});ef=st.gain>0?tr('ef_pts',{d:pct(st.gain)}):tr('ef_none');}
    else if(st.why){mv=tr('mv_why');ef=tr('ef_none');}
    else{mv=tr('mv_none');ef=tr('ef_none');}
    return {c:c,src:kn(c,'trust')+' '+kn(c,'src'),mv:mv,ef:ef,examined:st.why||!!best||st.acc};
  });
}
function renderResult(){
  var rows=claimRows(),n=CLAIMS.filter(function(c){return S.claims[c].why;}).length,m=rows.filter(function(r){return !r.examined;}).length;
  $('reveal').textContent=tr(S.path==='quick'?'rv_quick':'rv_sentence',{x:pct(finalPct()),n:n,m:m});
  var t='';
  rows.forEach(function(r){t+='<li><b>'+esc(kn(r.c,'claim'))+'</b><br><span class="k">'+esc(tr('thSrc'))+':</span> '+esc(r.src)+'<br><span class="k">'+esc(tr('thMove'))+':</span> '+esc(r.mv)+'<br><span class="k">'+esc(tr('thEff'))+':</span> '+esc(r.ef)+'</li>';});
  if(S.tbl.res&&S.tbl.res.k==='picked')t+='<li><b>'+esc(kn('table','title'))+'</b><br>'+esc(tableText(S.tbl.res))+'</li>';
  if(S.sur.n){var good=0;Object.keys(S.sur.res).forEach(function(k){if(S.sur.res[k]==='best')good++;});t+='<li><b>'+esc(kn('surprise','title'))+'</b><br>'+esc(tr('rv_sur',{n:S.sur.n,k:good}))+'</li>';}
  $('revealList').innerHTML=t;
}
function finish(path){
  if(S.done)return;
  S.path=path;S.offer=offerNow();S.done=true;
  MR.track('Offer Accepted',{path:path},path==='quick'?'mangukast.offer.quick':'mangukast.offer.sentence');

}

/* ---------- vestluskaart (markdown) ---------- */
function cardMd(hide){
  var v=vals(),f=fireModel(),rows=claimRows(),nl='\n';
  var md='# '+tr('md_title')+nl+nl+'_'+tr('md_note')+'_'+nl+nl+'## '+tr('md_sum')+nl+nl;
  md+='- '+tr('md_style')+': '+tr('st_'+S.style)+nl+'- '+tr('md_ask')+': '+pct(v.askU)+'%'+nl+'- '+tr('md_offer')+': '+pct(finalPct())+'%'+nl;
  if(v.walk!==null)md+='- '+tr('md_walk')+': '+pct(v.walk)+'%'+nl;
  if(v.pr.length)md+='- '+tr('md_prio')+': '+v.pr.map(function(l){return tr('lvl_'+l);}).join(', ')+nl;
  if(S.deal)md+='- '+tr('md_deal')+': '+describeP(S.deal.p)+nl;
  if(S.sur.n)md+='- '+tr('md_sur')+': '+S.sur.n+nl;
  if(v.dream)md+='- '+tr('md_dream')+': '+v.dream+nl;
  md+=nl+'## '+tr('md_claims')+nl+nl;
  rows.forEach(function(r){md+='- '+kn(r.c,'claim')+' ('+kn(r.c,'trust')+') \u2192 '+r.mv+'; '+r.ef+nl;});
  md+=nl+'## '+tr('md_todo')+nl+nl;
  var todo=CLAIMS.filter(function(k){return S.claims[k].status!=='broken';});
  if(!todo.length)md+=tr('md_none')+nl;
  todo.forEach(function(k){md+='- '+kn(k,'ask')+nl;});
  md+=nl+'## '+tr('md_sent')+nl+nl+(S.sentence?S.sentence:tr('md_none'))+nl;
  if(!hide&&f){md+=nl+'## '+tr('md_fire')+nl+nl+'- '+tr('fr0')+': '+rng(f.b4,f.b0)+nl+'- '+tr('fr1')+': '+rng(f.r4,f.r0)+nl+'- '+tr('fr2')+': '+rng(f.s4,f.s0)+nl;}
  return md;
}
