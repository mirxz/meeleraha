<script>
(function(){
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function tables(){
  var T=MR.tax,h='<tr><th>'+esc(MR.t('priv.th.event'))+'</th><th>'+esc(MR.t('priv.th.desc'))+'</th><th>'+esc(MR.t('priv.th.props'))+'</th></tr>';
  Object.keys(T.events).forEach(function(k){var e=T.events[k],ps=Object.keys(e.props).map(function(p){var en=T.enums[e.props[p].replace('enum:','')];return p+': '+(en.length>6?en.slice(0,5).join(' | ')+' | … ('+en.length+')':en.join(' | '));}).join('; ');h+='<tr><td><code>'+esc(k)+'</code></td><td>'+esc(MR.lang==='en'?e.desc_en:e.desc)+'</td><td>'+esc(ps||'–')+'</td></tr>';});
  document.getElementById('evt').innerHTML=h;
  var c='<tr><th>'+esc(MR.t('priv.th.component'))+'</th><th>'+esc(MR.t('priv.th.desc'))+'</th><th>'+esc(MR.t('priv.th.page'))+'</th></tr>';
  Object.keys(T.components).forEach(function(k){var x=T.components[k],pg=T.pages[x.page];c+='<tr><td><code>'+esc(k)+'</code></td><td>'+esc(MR.lang==='en'?x.desc_en:x.desc)+'</td><td>'+esc(pg?(MR.lang==='en'?pg.name_en+' ('+pg.space_en+')':pg.name+' ('+pg.space+')'):x.page)+'</td></tr>';});
  document.getElementById('cot').innerHTML=c;
}
function state(){var r=MR.measureReason();document.getElementById('tg').textContent=MR.measure()?MR.t('log.turn_off'):MR.t('log.turn_on');document.getElementById('tg').setAttribute('aria-pressed',MR.measure()?'true':'false');document.getElementById('tgState').textContent=r===null?MR.t('log.on'):MR.t('log.off.'+r);}
document.getElementById('tg').onclick=function(){MR.setMeasure(!MR.measure());state();};
document.getElementById('demo').onclick=function(){MR.track('Door Clicked',{door:'kast'},'index.hub.door',{dry:true});};
tables();state();MR.onLang(function(){tables();state();});
})();
</script>
