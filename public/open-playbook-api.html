/* Reference layout, skinned with the Meeleraha tokens from mr.css. Only tokens and component rules; the drawing code below is the generic one. */
:root{--mist:color-mix(in srgb,var(--ink) 8%,transparent)}
.mr-nav,.mr-foot{width:min(1180px,100% - 40px)}
.shell{width:min(1180px,100% - 40px);margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:0 28px;align-items:start;padding-top:12px}
.shell main{width:auto;margin:0;padding:12px 0 56px;display:flex;flex-direction:column;gap:36px;min-width:0}
aside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px}
aside input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
aside label{display:block;margin-bottom:6px}
.lbl{font-size:13px;font-weight:600;letter-spacing:.4px;color:var(--ink2)}
details{margin-top:6px} summary{cursor:pointer;list-style:none;padding:12px 6px 4px;display:flex;justify-content:space-between;font-size:14px;font-weight:600}
summary::-webkit-details-marker{display:none} summary::after{content:"+"} details[open] summary::after{content:"\2212"}
aside a{display:block;padding:6px 10px;border-radius:10px;color:var(--ink2);text-decoration:none;font-size:15px}
aside a:hover,aside a.on{background:var(--mist);color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
.sec h2{margin:0}
.lede{max-width:72ch;font-family:var(--serif);font-size:18px;line-height:1.5;margin:0}
.hero h1{margin:0}
.hero .row{margin:4px 0 0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 24px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kv span{display:block}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--link);border-radius:12px;padding:12px 16px;max-width:80ch}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px}
th{background:var(--mist);font-size:13px;font-weight:600;letter-spacing:.2px;white-space:nowrap;color:var(--ink2)}
tr:last-child td{border-bottom:0}
code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:var(--mist);border-radius:6px;padding:1px 6px;overflow-wrap:anywhere}
/* A status is a shape and a word, never colour alone. */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 10px 1px 8px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill i{width:9px;height:9px;background:currentColor;display:inline-block}
.pass{background:var(--good-bg);color:var(--good-fg)}.pass i{border-radius:50%}
.review{background:var(--warn-bg);color:var(--warn-fg)}.review i{clip-path:polygon(50% 0,100% 100%,0 100%)}
.gap{background:var(--bad-bg);color:var(--bad-fg)}.gap i{transform:rotate(45deg) scale(.8)}
.manual{background:var(--info-bg);color:var(--info-fg)}.manual i{border-radius:2px}
.off{background:transparent;border:1px dashed var(--ink2);color:var(--ink2)}.off i{background:none;border:2px solid currentColor;border-radius:50%}
.method{font:700 11px ui-monospace,Menlo,monospace;border-radius:6px;padding:1px 8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.method.read{background:var(--link);color:var(--onlink);border-color:var(--link)}
.method.write{background:var(--sun);color:#241f3a;border-color:var(--sun)}
.empty{padding:16px;border:1px dashed var(--ink2);border-radius:16px;background:var(--card)}
.stamp{color:var(--ink2);font-size:13px;margin:0}
.toggle{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)} aside{position:static;max-height:none;display:none}
  aside.open{display:block;margin-bottom:12px} .toggle{display:inline-flex;margin:12px 20px 0;align-items:center}
  .shell main{padding:12px 0 40px}
}
@media print{#mr-nav,#mr-banner,#mr-foot,aside,.toggle,#sky{display:none} .shell{display:block}}

)`", "Summed over the levers. The multiplier depends on the other side's style."], ["Value to you", "`V = sum(steps * price * rank)`", "`rank` is 3, 2 and 1.5 for the first three priorities, otherwise 1."], ["Their budget", "`B = (offer + pool) * cut`", "`cut` is 0.7 after a budget cut, otherwise 1."], ["Solver", "All combinations of steps", "Returns the package with the highest `V` inside `B`, or the cheapest package that reaches a target `V`."]]}]}, {"id": "reading", "group": "Usage", "title": "Reading result", "lede": "One sentence becomes typed answers with probabilities, the same shape a System One model returns.", "blocks": [{"type": "table", "columns": ["Field", "Type", "Meaning", "Rule today"], "rows": [["`style`", "Choice with a probability per option", "How the other side tends to answer", "Highest wins; under 0.6 the page asks one question."], ["`claims`", "`{on, p}` per claim", "Which of the five claims is on the table", "On when `p` is 0.6 or more."], ["`levers`", "Top three of eight", "What matters to the person", "Heard levers first; defaults (pay, leave, learning) fill the rest and are marked."], ["`ask`, `offer`, `walk`, `pay`", "`{value, p}`", "Raise wanted, offer heard, floor, annual pay", "A missing value stays missing; the offer falls back to the style start; pay to 60,000 and the page says so."]]}, {"type": "note", "text": "Probabilities today are rule scores, not calibrated model output, and the page marks them as inferred. Proposed for a calibrated model: 0.9 or more fills the field, 0.6 to 0.9 pre-fills and asks for a tap, under 0.6 asks."}]}, {"id": "link", "group": "Usage", "title": "State link and card", "lede": "The front door hands its reading to the game box in the address fragment, for example `mangukast.html#s=busy&a=10&w=5&p=salary,leave,learn&k=budget`.", "blocks": [{"type": "table", "columns": ["Key", "Meaning", "Rule"], "rows": [["`s`", "Style: firm, flex or busy", "An unknown value is ignored and nothing is opened."], ["`a`, `w`", "Raise wanted and floor, in percent", "Numbers only; clamped by the page."], ["`p`", "Three levers, comma separated", "Unknown levers are skipped."], ["`k`", "Claim to open first", "Unknown claims are skipped."]]}, {"type": "note", "text": "The fragment never reaches a server, and pay is never in the link. The conversation card is a Markdown file the person downloads: summary, what the machine heard, the table, the manager's pick and what it does not know. The option \"without amounts\" leaves out costs and times. It is a conversation starter, not advice."}]}, {"id": "events", "group": "Usage", "title": "Events", "lede": "Measurement is a closed list of 54 events; properties are enumerations, and text and numbers never appear (tested).", "blocks": [{"type": "table", "columns": ["Event", "Properties", "Fires when"], "rows": [["Sentence Read", "`confidence`: high, mid, low", "A sentence was read"], ["Reading Corrected", "`field`: style, claim, priority, ask, offer, walk, pay", "The person corrected a line"], ["Package Offered", "`result`: picked, none", "Packages were offered"], ["Surprise Drawn", "`surprise_id`: cap, cut, gift, swap", "A limit was switched on or a card drawn"], ["Surprise Answered", "`surprise_id`, `outcome`: best, close, far", "A surprise was answered"], ["Gamebox Opened", "none", "The game box was opened from the front door"], ["Debate Started, Debate Restarted", "`style` (started only)", "The practice started or restarted"], ["Evidence Brought, Why Opened, Claim Challenged, Claim Accepted", "`evidence_id`, `claim_id`, `outcome`", "A step in a knot"], ["Cheap Levers Asked, Package Saved, Offer Accepted", "`slot_id`, `path`", "A step at the table or at the end"], ["Independence Shift Viewed", "`bucket`: none, lt1, 1to3, 3plus", "The time to independence was shown"]]}]}, {"id": "op-live", "group": "Operations", "title": "Live today", "lede": "These contracts exist now, as files and page behaviour. None of them is an HTTP service.", "blocks": [{"type": "ops", "rows": [{"mode": "read", "path": "/taxonomy.json", "status": {"s": "pass", "t": "Allowed"}, "desc": "Public JSON: 54 events, 66 components, 42 enumerations."}, {"mode": "read", "path": "/vaidle-mudel.js", "status": {"s": "review", "t": "Needs a look"}, "desc": "Model v0.3 as a JS module (`window.VM`): tables, solver, owner, review date. Assumptions unreviewed."}, {"mode": "read", "path": "mangukast.html#s=...", "status": {"s": "pass", "t": "Allowed"}, "desc": "State link from the front door to the game box. Never reaches a server."}, {"mode": "read", "path": "vaidle.md, vaidlus.md", "status": {"s": "pass", "t": "Allowed"}, "desc": "Conversation cards the person downloads from the front door and from the game box."}, {"mode": "read", "path": "ajatelg file, version 2", "status": {"s": "pass", "t": "Allowed"}, "desc": "Life timeline JSON: age, horizon, scale, work end, money, blocks. Import and export in the page."}, {"mode": "read", "path": "tingi.html readSentence, derive", "status": {"s": "review", "t": "Needs a look"}, "desc": "One sentence to typed answers with probabilities. Rule scores, not calibrated."}]}]}, {"id": "op-model", "group": "Operations", "title": "Model", "lede": "Draft endpoints. Closed until stage 1, when the exports exist and are validated in CI.", "blocks": [{"type": "ops", "rows": [{"mode": "read", "path": "api/v1/model.json", "status": {"s": "off", "t": "Closed"}, "desc": "The negotiation model: tables, prices, multipliers, version, owner and review date."}, {"mode": "read", "path": "api/v1/model/changelog.json", "status": {"s": "off", "t": "Closed"}, "desc": "Receipts for every model version: what changed, why, who reviewed, what was flagged."}]}]}, {"id": "op-playbooks", "group": "Operations", "title": "Playbooks", "lede": "Draft endpoints. Closed until stage 1; the pension rules wait for the 2027 law text.", "blocks": [{"type": "ops", "rows": [{"mode": "read", "path": "api/v1/playbooks/negotiation.json", "status": {"s": "off", "t": "Closed"}, "desc": "The negotiation playbook: 5 claims, 3 styles, 8 levers, the surprise deck."}, {"mode": "read", "path": "api/v1/playbooks/pension-rules.json", "status": {"s": "off", "t": "Closed"}, "desc": "The pension rules: 26 nodes, 18 rumors, trust marks and check dates."}, {"mode": "read", "path": "api/v1/playbooks/thread.json", "status": {"s": "off", "t": "Closed"}, "desc": "The thread of knots: 8 knots, 6 situations, rings and trust marks."}, {"mode": "read", "path": "api/v1/playbooks/timeline-format.json", "status": {"s": "off", "t": "Closed"}, "desc": "The life timeline file format, version 2."}]}]}, {"id": "op-catalog_and_measurement", "group": "Operations", "title": "Catalog and measurement", "lede": "Draft endpoints. The taxonomy is live today at `/taxonomy.json`; the versioned path opens at stage 1.", "blocks": [{"type": "ops", "rows": [{"mode": "read", "path": "api/v1/catalog.json", "status": {"s": "off", "t": "Closed"}, "desc": "The toolbox catalog: 16 entries in 9 languages."}, {"mode": "read", "path": "api/v1/taxonomy.json", "status": {"s": "off", "t": "Closed"}, "desc": "Events, components and enumerations. Live today at /taxonomy.json."}]}]}, {"id": "op-reading", "group": "Operations", "title": "Reading", "lede": "Draft endpoint. Closed until stage 3. If it ever opens it is a separate, opt-in button that says what is sent.", "blocks": [{"type": "ops", "rows": [{"mode": "read", "path": "api/v1/read", "status": {"s": "off", "t": "Closed"}, "desc": "One sentence in, typed answers with probabilities out. Opt-in, after a click, no logging."}]}]}, {"id": "privacy", "group": "Guardrails", "title": "Privacy and data", "lede": "Today nothing a person types leaves the browser; the rest of this group says what could change, under which conditions, and what each step would cost.", "blocks": [{"type": "table", "columns": ["Promise today", "How it is held", "Checked"], "rows": [["Numbers and text stay in the browser", "No request carries them; tests cover sentence, numbers and dream", {"s": "pass", "t": "Allowed"}], ["Only clicks are measured, not what is written", "A closed event list; free-text properties are rejected", {"s": "pass", "t": "Allowed"}], ["No cookies, no persistent identifier, no IP stored; events counted by day", "Design of the counter; the server side is not live yet", {"s": "review", "t": "Needs a look"}], ["Every page shows what it sends; measurement can be switched off", "Footer panel; Do Not Track and Global Privacy Control apply automatically", {"s": "pass", "t": "Allowed"}], ["Data leaves only when the person writes a message or orders something", "Contact page uses the mail client; no form posts to a server", {"s": "pass", "t": "Allowed"}], ["Legal assessment of the measurement", "Not done; to be reviewed by a lawyer before public launch", {"s": "manual", "t": "Manual"}]]}, {"type": "note", "text": "**Last checked 2026-10-17:** a research note recorded that the only outgoing request is `POST /api/e`, which answered 404, so the server side of measurement is not live. **Found in the page source the same day:** every Meeleraha page loads its fonts from Google (`fonts.googleapis.com`), which is a request to a third party at page load; the note did not mention it. To be rechecked in a browser. Self-hosting the fonts or using system fonts would remove it. **Not checked:** what is sent after a sentence is entered."}]}, {"id": "collect", "group": "Guardrails", "title": "What may be collected", "lede": "Only fields whose possible values are known in advance may ever be shared: choices, ranges and outcomes.", "blocks": [{"type": "table", "columns": ["Field type", "Example", "Share?", "Note"], "rows": [["Free text", "The sentence about the conversation, a dream, a search", {"s": "off", "t": "No"}, "Cannot be aggregated and is the most sensitive part. Stays in the browser."], ["Exact number", "Pay, cost, saving", {"s": "off", "t": "No"}, "If ever needed, only as a coarse range."], ["Choice from a list", "Style: firm, flex, busy. Evidence: peer, offer", {"s": "pass", "t": "Yes"}, "Fits a histogram."], ["Outcome from a list", "Claim outcome: held, weakened, broken", {"s": "pass", "t": "Yes"}, "Shows which claims fall."], ["Range", "Independence shift: none, lt1, 1to3, 3plus", {"s": "pass", "t": "Yes"}, "Coarse enough not to identify anyone."]]}, {"type": "note", "text": "**What a statistic would say:** what people chose in a practice game, not market pay. Practice often uses sample or wished-for numbers, and the sample is people who found the tool and agreed to share. It suits \"which levers and claims are popular\", not \"how much is paid\". Every aggregate would be labelled entered, unconfirmed. Sharing protects inputs, not outputs: a small group can still reveal one person, so an aggregate is published only above a minimum group size."}]}, {"id": "options", "group": "Guardrails", "title": "Options for collecting", "lede": "Four options in growing order of effort and need to trust someone; the recommendation is A, then B, and C or D only when a question demands it.", "blocks": [{"type": "table", "columns": ["Option", "What it gives", "Whom you must trust", "Effort", "Fits when"], "rows": [["A · Counts of enumerated events (today)", "Daily counts of allowed values", "Meeleraha's own server: it sees a count, not a person", "Small: the endpoint, legal review", "The question is \"what was clicked\""], ["B · Local randomisation (local differential privacy)", "Each browser randomises its choice before sending; population statistics stay recoverable", "Nobody: it happens in the browser", "Small to medium; needs thousands of users", "You want rough ranges without trusted servers"], ["C · Two-server summation with a proof (Prio-type)", "Exact sums and histograms; a proof rejects invented inputs", "Two independent operators who do not collude", "Medium", "You need exact sums but not medians"], ["D · Secret sharing across several parties (Sharemind)", "Also medians, percentiles, regression; authorised queries only", "Independent operators; the vendor page names no count or threat model", "Large: partnership, licence and hosting unclear", "Questions need distributions and the sample is big enough"]]}, {"type": "note", "text": "**Sources and limits:** A and D rest on the read sources (the privacy policy, the Sharemind MPC page, the ITL case study). The descriptions of B and C are general knowledge and were not researched here, so check them before deciding."}]}, {"id": "community", "group": "Guardrails", "title": "Rewriting the rules, openly", "lede": "The current rules are a design decision, not a limit; each may change only if it brings a named benefit, the default stays the same, and the change log is public.", "blocks": [{"type": "table", "columns": ["Rule today", "Rule in an opt-in community mode", "What it gives", "What it costs"], "rows": [["Numbers and text never leave the browser", "Structured fields leave only as random shares; free text never leaves", "Aggregates of dreams, levers and outcomes", "Needs explaining, independent parties and a legal assessment"], ["We measure clicks, not what is written", "We also measure the person's own coded choices (a taxonomy)", "Dream, limit, lever and outcome in one dataset", "Taxonomy design; a combination of fields can identify someone"], ["No persistent identifier", "An optional research identifier, only in a research mode, kept as shares", "Measuring change over time", "Breaks today's promise; needs an ethics review and clear consent"], ["Events counted by day", "An aggregate is published only above a minimum group size", "Avoids exposing a small group", "Part of the data stays unpublished in a small population"], ["Do Not Track and Global Privacy Control apply", "They stay: the signal blocks the offer of the mode", "Trust", "Fewer participants"], ["No legal assessment yet", "The assessment is done before the mode starts", "A lawful basis", "Time and money"]]}, {"type": "table", "columns": ["Principle", "In practice"], "rows": [["Version the rules", "Today's local mode stays the default; a new mode is separate; the change log is public."], ["Never retroactive", "Whoever does not choose, shares nothing."], ["Keep the strongest promise checkable", "\"Free text never leaves\" stays, and the shares are visible before sending."], ["Name the state as a role, not an owner", "One party among several and a consumer of aggregates."], ["Separate practice from research", "Ethics principles are written down in public."], ["Ask three things of every change", "What is the benefit, who feels it, and what happens if one party misuses it."]]}]}, {"id": "independence", "group": "Guardrails", "title": "What independence needs", "lede": "Independence is organisational and legal, not technical: three chains whose keys are held by the same person are still one party.", "blocks": [{"type": "table", "columns": ["Requirement", "Why"], "rows": [["Different legal entities, for example a university, a non-profit and a technology company; a state body as one party, never more than one", "One owner behind several nodes is a promise, not a property."], ["Different administrators, keys, and cloud providers or locations", "A single administrator across three servers should not be the norm."], ["A written agreement not to collude, and a public page saying who does what", "Lets anyone check the claim."], ["Authorised queries and an audit log, not only a pledge", "The Sharemind MPC page says both exist."], ["A public, tamper-evident log of allowed queries and published results (hashes only)", "A blockchain helps with transparency, not storage: shares written to a public chain cannot be deleted. General knowledge, not researched here."], ["The browser code is served and checkable by someone other than the game maker", "The weakest link is the client: whoever changes the script can forward the value unshared. Open source, a verifiable hash and an audit reduce that."]]}]}, {"id": "never", "group": "Guardrails", "title": "Things that are never okay", "lede": "These hold at every stage, whoever asks.", "blocks": [{"type": "table", "columns": ["Never", "How it is held"], "rows": [["Collecting, storing or sending a person's numbers, sentences or files, except by a button the person pressed that says what leaves", "A closed event list; privacy tests; no write operation exists"], ["Presenting a result as advice, a forecast or a guarantee", "Wording on every page; legal review at stage 2"], ["Hiding an assumption", "Trust marks; owner, version and review date on the model"], ["Scoring, ranking or profiling individuals", "No such operation exists in the draft"], ["Training a model on what people typed", "Any optional reading service logs nothing and sends only what the button says"], ["Acting for a person: sending an offer, a message or a payment", "The API is read-only"], ["Letting a partner change the model's numbers without a receipt and the reviews", "Change control below; a CI check is planned (stage 1)"], ["Selling aggregates, or publishing anything at the level of one person", "A public promise to be written before any collection starts (this is a recommendation, not an existing rule)"], ["Calling a release done before the tests have run and the flagged list has been shown", "The release rule; tests run before every release"]]}]}, {"id": "change", "group": "Guardrails", "title": "Change control", "lede": "Every change to the model ends with a version, a receipt and a flagged list, so a reviewer can see what moved and what nobody has checked.", "blocks": [{"type": "table", "columns": ["Change", "Version step", "Who reviews"], "rows": [["Wording only", "Patch (0.3.1)", "Model owner"], ["A number changes: a price, a multiplier, a strength", "Minor (0.4)", "Model owner and one reviewer; two from stage 2"], ["A field changes meaning, or a lever, claim or style is added or removed", "Major (1.0)", "Model owner, two reviewers, and a lawyer if the wording could read as advice"]]}, {"type": "table", "columns": ["Receipt field", "Sample value (a sample, not a real change)"], "rows": [["Change", "Learning budget price from 500 to 600 per step"], ["Why", "Three employers quoted 600 in 2026"], ["Source type", "Secondary (employer quotes), not verified"], ["Reviewed by", "Name, date"], ["Tests", "All green (count)"], ["Flagged", "The quotes were not seen by the reviewer"]]}]}, {"id": "rollout", "group": "Reference", "title": "Rollout stages", "lede": "One ladder, five stages: each adds exactly one thing, no stage is skipped, and no gate is passed without the named people saying yes. A failed or surprising result sends the team back one stage, not forward.", "blocks": [{"type": "table", "columns": ["Stage", "Where", "What is allowed", "Who performs", "Signs off to enter", "Evidence they look at"], "rows": [["0 Prototype", "Repository and browser", "Open files, local rules, tests", "Mirko", "Mirko", "Tests green; flagged list shown"], ["1 Open files", "Static JSON under `/api/v1/`", "Read-only exports, version in the path", "Mirko", "Mirko and one reviewer", "Exports validate against a schema in CI; receipt check works"], ["2 Reviewed model", "Same", "Prices and multipliers reviewed; wording reviewed", "Mirko; reviewers review", "Two reviewers (one a Total Rewards practitioner) and a lawyer", "A receipt per changed assumption; a legal note on \"education, not advice\""], ["3 Calibrated reading", "First at design time, with invented sentences only; later, optionally, a separate button", "Local rules calibrated against a typed-answer model. Only after a click and a plain statement of what is sent, a closer reading", "Mirko", "Mirko and a lawyer", "Calibration check on invented sentences; data-protection review; cost per call known"], ["4 Partner pilot", "The partner's own tools", "Employees reach a playbook through the partner, under a written agreement", "The partner; Mirko supports", "Mirko, the partner and a lawyer", "Pilot report; an undo path named"]]}, {"type": "note", "text": "Only stage 0 exists today. Stages 1 to 4 are closed until the items in \"Not built yet\" exist."}]}, {"id": "notbuilt", "group": "Reference", "title": "Not built yet", "lede": "Stages 1 to 4 stay closed because the following does not exist; each item needs its own tests and review.", "blocks": [{"type": "table", "columns": ["Item", "Needed before", "Status"], "rows": [["JSON exports of the model, the knots and the pension rules, validated against a schema in CI", "Stage 1", {"s": "off", "t": "Closed"}], ["A read-only static endpoint such as `/api/v1/model.json`, with the version in the path", "Stage 1", {"s": "off", "t": "Closed"}], ["A CI check that a model change carries a receipt and a reviewer", "Stage 1", {"s": "off", "t": "Closed"}], ["A licence and an attribution line for reuse", "Stage 1", {"s": "off", "t": "Closed"}], ["A named reviewer roster: at least one Total Rewards practitioner and one lawyer", "Stage 2", {"s": "off", "t": "Closed"}], ["Review of the lever prices and cost multipliers", "Stage 2", {"s": "off", "t": "Closed"}], ["The 2027 pension-law text read and the rules updated", "Before the pension rules are exported", {"s": "off", "t": "Closed"}], ["Model texts in the seven languages beyond Estonian and English", "Stage 2", {"s": "off", "t": "Closed"}], ["A legal assessment of the measurement, and a decision whether `/api/e` goes live and with which events", "Before any collection", {"s": "manual", "t": "Manual"}], ["A check of network requests after a sentence is entered, to confirm that nothing leaves in full use", "Before any collection", {"s": "manual", "t": "Manual"}], ["Answers from the Sharemind team: (1) does the client library run in a browser, (2) how many parties and which trust model, (3) who hosts the nodes, (4) on what terms may a free educational tool use the SDK and the emulator, (5) can two browsers compare limits without a trusted server", "Before option D and before any two-party comparison", {"s": "off", "t": "Closed"}], ["A calibration set of invented sentences to test the local reading rules", "Stage 3", {"s": "off", "t": "Closed"}], ["Fonts self-hosted or replaced by system fonts, so that no page requests anything from a third party at load", "Before any collection", {"s": "off", "t": "Closed"}], ["A partner pilot agreement", "Stage 4", {"s": "off", "t": "Closed"}]]}]}, {"id": "where", "group": "Reference", "title": "Where things live", "lede": "Short, concrete, plain: the rule before the explanation, numbers before adjectives, and a plain note of what was not checked. Sample values in examples are sample values.", "blocks": [{"type": "table", "columns": ["Path", "What it holds"], "rows": [["`public/vaidle-mudel.js`", "The negotiation model: tables, solver, version, owner, review date"], ["`public/tingi.html`", "The front door: one sentence to a table of three packages"], ["`public/mangukast.html`", "The game box: seven knots, limits, finance bridge, card"], ["`public/ots.html`, `public/haruta.html`, `public/ajatelg.html`", "Thread of knots, pension rules, life timeline"], ["`public/kast.html`", "The toolbox catalog (JSON block)"], ["`public/taxonomy.json`", "Events, components and enumerations"], ["`public/open-playbook-api.html`", "This page, built from the OpenAPI draft, the allowlist and the hand sections (`tools/open-playbook-api/`)"], ["`tests/`", "The test suite: about 230 cases in 17 files"], ["`README.md`", "How the pieces fit together"]]}]}, {"id": "sources", "group": "Reference", "title": "Sources", "lede": "Pages opened for this draft on 2026-10-17; anything marked as general knowledge was not researched here.", "blocks": [{"type": "table", "columns": ["Page", "Used for"], "rows": [["Pactum, Single-Source Negotiation Agent: `pactum.com/procurement-agents/single-source-negotiation`", "Several equal offers and limits set first"], ["TypeSafe, System One: `docs.typesafe.ai/concepts/system-one`", "Typed answers with probabilities"], ["Shreeraj Gujar, The Dashboard Is Dead. Long Live the Question: `medium.com/@shreerajgujar`", "The semantic-layer pattern"], ["Sharemind MPC: `cyber.ee/products/sharemind-mpc/`", "Option D: what the product page says and does not say"], ["ITL case study: `research.cyber.ee/~jan/publ/itl-system-case-study.pdf`", "An earlier secret-sharing deployment in a web form"], ["Decision Spine: `decisionspine.com`", "Later: testing whether analytics AI answers honestly"], ["Meeleraha privacy page and the front door, read in a browser", "What the site promises and sends today"]]}]}]}

<script>
(function(){
  var spec = JSON.parse(document.getElementById('spec').textContent);
  var $ = function(id){return document.getElementById(id)};
  function el(tag, cls, text){var e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e}
  // Inline markup, safely: `code` and **bold** only. Everything else is plain text.
  function rich(parent, s){
    String(s).split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(function(p){
      if(!p) return;
      if(p[0]==='`') parent.appendChild(el('code',null,p.slice(1,-1)));
      else if(p.slice(0,2)==='**'){var b=el('b',null,p.slice(2,-2)); parent.appendChild(b)}
      else parent.appendChild(document.createTextNode(p));
    });
  }
  function pill(o){var p=el('span','pill '+o.s); p.appendChild(el('i')); p.appendChild(document.createTextNode(o.t)); return p}
  function cell(td, v){ if(v && typeof v==='object') td.appendChild(pill(v)); else rich(td, v) }

  document.title = spec.title + ' | Raha Meeled';
  var main=$('main'), nav=$('nav');
  var hero=el('div','sec hero'); hero.appendChild(el('span','lbl','Reference')); hero.appendChild(el('h1',null,spec.title));
  var lede=el('p','lede'); rich(lede, spec.intro||''); hero.appendChild(lede);
  if(spec.badge){var row=el('div','row'); row.appendChild(el('span','chip t-info',spec.badge)); hero.appendChild(row)}
  main.appendChild(hero);

  var groups={}, order=[];
  spec.sections.forEach(function(s){
    if(!groups[s.group]){groups[s.group]=[];order.push(s.group)} groups[s.group].push(s);
    var sec=el('section','sec'); sec.id=s.id; sec.dataset.text=''; sec.appendChild(el('h2',null,s.title));
    if(s.lede){var l=el('p','lede'); rich(l,s.lede); sec.appendChild(l)}
    (s.blocks||[]).forEach(function(b){
      if(b.type==='kv'){var d=el('div','kv'); b.items.forEach(function(it){var x=el('div'); x.appendChild(el('span','lbl',it[0])); var v=el('span'); rich(v,it[1]); x.appendChild(v); d.appendChild(x)}); sec.appendChild(d)}
      else if(b.type==='note'){var n=el('div','note'); rich(n,b.text); sec.appendChild(n)}
      else if(b.type==='table'||b.type==='ops'){
        var cols=b.type==='ops'?['Operation','Access','Status','What it does']:b.columns;
        var rows=b.type==='ops'?b.rows.map(function(r){return [{m:r.mode,p:r.path},r.mode==='write'?'Write':'Read',r.status,r.desc]}):b.rows;
        var wrap=el('div','tscroll'), t=el('table'), th=el('thead'), tr=el('tr');
        cols.forEach(function(c){tr.appendChild(el('th',null,c))}); th.appendChild(tr); t.appendChild(th);
        var tb=el('tbody'); rows.forEach(function(r){var row=el('tr');
          r.forEach(function(v,i){var td=el('td');
            if(v&&v.p!==undefined){td.appendChild(el('span','method '+v.m,v.m==='write'?'write':'read')); td.appendChild(document.createTextNode(' ')); td.appendChild(el('code',null,v.p))}
            else cell(td,v); row.appendChild(td)}); tb.appendChild(row)});
        t.appendChild(tb); wrap.appendChild(t); sec.appendChild(wrap);
      }
    });
    sec.dataset.text=sec.textContent.toLowerCase(); main.appendChild(sec);
  });
  var empty=el('div','empty','Nothing matches. Clear the search box.'); empty.hidden=true; main.appendChild(empty);
  if(spec.stamp){main.appendChild(el('p','stamp',spec.stamp))}

  order.forEach(function(g,i){var d=el('details'); if(i===0)d.open=true; d.appendChild(el('summary','lbl',g));
    groups[g].forEach(function(s){var a=el('a',null,s.title); a.href='#'+s.id; a.dataset.sec=s.id; d.appendChild(a)}); nav.appendChild(d)});

  // Search: hides sections and links that do not contain the text.
  $('q').addEventListener('input',function(e){var q=e.target.value.trim().toLowerCase(), shown=0;
    spec.sections.forEach(function(s){var sec=$(s.id), hit=!q||sec.dataset.text.indexOf(q)>-1; sec.hidden=!hit; if(hit)shown++;
      var a=nav.querySelector('[data-sec="'+s.id+'"]'); a.hidden=!hit; if(hit&&q)a.parentNode.open=true});
    empty.hidden=shown>0});
  // Mobile contents toggle.
  $('toggle').addEventListener('click',function(){var o=$('side').classList.toggle('open'); this.setAttribute('aria-expanded',o)});
  // Highlight the section in view.
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){
      nav.querySelectorAll('a.on').forEach(function(a){a.classList.remove('on')});var a=nav.querySelector('[data-sec="'+e.target.id+'"]'); if(a)a.classList.add('on')}})},{rootMargin:'-20% 0px -70% 0px'});
    spec.sections.forEach(function(s){io.observe($(s.id))})}
})();
</script>
</body></html>
