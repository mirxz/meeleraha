<script>
(function(){
var CAT=JSON.parse(document.getElementById('catalog').textContent),st={ring:'all',type:'all',status:'all',q:''};
var DIMS={ring:['mina','lahedased','seadus','aeg'],type:['tool','download','game'],status:['live','building','idea']};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function name(it){return (it[MR.lang]||it.en||it.et);}
function filters(){
  var h='';Object.keys(DIMS).forEach(function(d){
    h+='<div class="row" role="group" aria-label="'+esc(MR.t('kast.filter.'+d))+'"><span class="small" style="align-self:center">'+esc(MR.t('kast.filter.'+d))+'</span>';
    ['all'].concat(DIMS[d]).forEach(function(v){h+='<button type="button" class="btn" aria-pressed="'+(st[d]===v?'true':'false')+'" data-f="'+d+'" data-v="'+v+'" data-mr-c="kast.filters.filter" data-mr-e="Filter Changed" data-mr-p-filter="'+d+'" data-mr-p-value="'+v+'">'+esc(v==='all'?MR.t('kast.all'):MR.t(d+'.'+v))+'</button>';});
    h+='</div>';
  });
  var box=document.getElementById('fbox');box.innerHTML=h;
  Array.prototype.forEach.call(box.querySelectorAll('button'),function(b){b.addEventListener('click',function(){st[b.getAttribute('data-f')]=b.getAttribute('data-v');render();});});
}
function match(it){
  if(st.ring!=='all'&&it.ring!==st.ring)return false;if(st.type!=='all'&&it.type!==st.type)return false;if(st.status!=='all'&&it.status!==st.status)return false;
  if(st.q){var n=name(it),t=(n.n+' '+n.d).toLowerCase();if(t.indexOf(st.q.toLowerCase())<0)return false;}
  return true;
}
function render(){
  filters();
  var items=CAT.filter(match),h='';
  items.forEach(function(it){
    var n=name(it),live=it.status==='live'&&it.href;
    h+='<article class="card" data-tool="'+it.id+'"><div class="row" style="margin-top:0"><span class="chip">'+esc(MR.t('ring.'+it.ring))+'</span><span class="chip">'+esc(MR.t('type.'+it.type))+'</span><span class="chip '+(it.status==='live'?'t-good':(it.status==='building'?'t-warn':'t-info'))+'">'+esc(MR.t('status.'+it.status))+'</span><span class="chip t-good">'+esc(MR.t('kast.free'))+'</span></div><h2>'+esc(n.n)+'</h2><p>'+esc(n.d)+'</p>';
    if(live)h+='<a class="btn go" href="'+it.href+'" data-mr-c="kast.catalog.tool-card" data-mr-e="Tool Opened" data-mr-p-tool-id="'+it.id+'">'+esc(MR.t('kast.open'))+'</a>';
    else h+='<a class="btn" href="kontakt.html?reason=tool&amp;tool='+it.id+'" data-mr-c="kast.catalog.waitlist-button" data-mr-e="Waitlist Clicked" data-mr-p-tool-id="'+it.id+'">'+esc(MR.t('kast.notify'))+'</a>';
    h+='</article>';
  });
  var list=document.getElementById('list');list.innerHTML=h||'<p class="small">'+esc(MR.t('kast.empty'))+'</p>';
  document.getElementById('count').textContent=MR.tn('kast.count',items.length);
  MR.fixLinks(list);
}
document.getElementById('q').addEventListener('input',function(){st.q=this.value;render();});
MR.onLang(render);render();
})();
</script>
